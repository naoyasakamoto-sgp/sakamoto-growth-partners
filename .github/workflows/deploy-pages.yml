name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build and validate
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public site
        run: |
          mkdir -p _site
          rsync -a             --exclude '.git/'             --exclude '.github/'             --exclude '_site/'             --exclude 'node_modules/'             --exclude 'content/'             --exclude 'scripts/'             --exclude 'docs/'             --exclude 'package.json'             --exclude 'package-lock.json'             --exclude 'README.md'             --exclude 'netlify.toml'             ./ _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
