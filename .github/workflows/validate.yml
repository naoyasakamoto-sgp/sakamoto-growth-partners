name: Validate static site

on:
  pull_request:
  push:
    branches:
      - feature/sgp-news

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build and validate
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          echo "npm_test_exit_code=${status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log-${{ github.sha }}
          path: validation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated site outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-${{ github.sha }}
          path: |
            index.html
            sitemap.xml
            robots.txt
            news/index.html
            news/feed.xml
            news/*/index.html
            case-studies/index.html
            case-studies/*/index.html
            contact/index.html
            assets/case-studies/my-jazz-day/*.webp
          if-no-files-found: error
          retention-days: 7
