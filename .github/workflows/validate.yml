name: Validate static site

on:
  pull_request:
  push:
    branches:
      - feature/sgp-news

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Build and validate
        run: npm test
