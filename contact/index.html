<body data-analytics-page="contact">
  <header class="text-header">
    <div class="text-header-inner">
      <a class="text-logo" href="../"><img src="../assets/sgp-wordmark-v2.webp" alt="Sakamoto Growth Partners" /></a>
      <nav class="text-nav"><a href="../">HOME</a><a href="../services/it-adviser/">社外IT担当</a><a href="../naoya-sakamoto/">坂本について</a></nav>
    </div>
  </header>

  <main class="text-wrap">
    <section>
      <h1>30分、話してみる。</h1>
      <p class="lead">何を頼むか決まっていなくても大丈夫です。</p>
      <p>今困っていることを、そのまま書いてください。相談だけで終わっても構いません。</p>
      <div data-contact-source-banner hidden>
        <p class="small">相談のきっかけ：<strong data-contact-source-label></strong></p>
      </div>
    </section>

    <section>
      <form class="plain-form" data-contact-form>
        <input type="hidden" name="lead_source" data-lead-source value="direct" />
        <input type="hidden" name="lead_case" data-lead-case value="" />
        <input type="hidden" name="lead_intent" data-lead-intent value="general" />
        <input type="hidden" name="lead_plan" data-lead-plan value="" />

        <div class="form-field">
          <label for="name">お名前</label>
          <input id="name" name="name" autocomplete="name" required />
        </div>

        <div class="form-field">
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <fieldset>
          <legend>相談したいこと</legend>
          <label class="radio-line"><input type="radio" name="topic" value="30分無料相談" required />まず30分話したい</label>
          <label class="radio-line"><input type="radio" name="topic" value="初回1業務改善無料について" />初回1業務改善無料について</label>
          <label class="radio-line"><input type="radio" name="topic" value="社外IT担当・IT顧問について" />社外IT担当について</label>
          <label class="radio-line"><input type="radio" name="topic" value="AI活用・自動化について" />AI・自動化について</label>
          <label class="radio-line"><input type="radio" name="topic" value="まだ決まっていない" />まだ決まっていない</label>
        </fieldset>

        <div class="form-field">
          <label for="company">会社名・屋号 <span class="small">任意</span></label>
          <input id="company" name="company" autocomplete="organization" />
        </div>

        <div class="form-field">
          <label for="message">今困っていること <span class="small">任意</span></label>
          <textarea id="message" name="message" placeholder="例：見積と案件情報がExcelとLINEに分かれていて面倒です。"></textarea>
        </div>

        <button class="form-submit" type="submit">相談メールを作る →</button>
        <p class="form-note">押すとメールアプリが開きます。フォーム内容をWebサーバーへ自動保存する仕様ではありません。</p>
      </form>
    </section>

    <section>
      <h2>直接メールでも構いません。</h2>
      <p><a href="mailto:naoya.sakamoto@sakamoto-growth-partners.com" data-analytics-event="contact_direct_mail_click">naoya.sakamoto@sakamoto-growth-partners.com</a></p>
    </section>
  </main>
