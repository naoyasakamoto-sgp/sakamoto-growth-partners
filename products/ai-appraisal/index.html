<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGP AI査定 MVP</title><link rel="stylesheet" href="../../styles.css"><style>
:root{--c:#12aaa7;--ink:#0c2027;--mut:#657a80}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:#f4f8f8}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.hero{padding:70px 0;background:#071920;color:#fff}.hero h1{font-size:clamp(40px,6vw,70px);line-height:1.08;margin:8px 0 18px;letter-spacing:-.05em}.hero em{font-style:normal;color:#63e4d4}.hero p{color:#abc0c5;max-width:760px}.app{padding:50px 0}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.card{background:#fff;border:1px solid #d8e5e7;border-radius:18px;padding:22px;box-shadow:0 20px 55px rgba(5,25,30,.08)}label{display:grid;gap:5px;font-size:11px;font-weight:800;margin:10px 0}input,select{padding:11px;border:1px solid #cadadd;border-radius:8px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:9px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{width:100%;background:linear-gradient(135deg,#15b5b3,#55dece);color:#002024;margin-top:12px}.sample{background:#eef5f5;color:#214047}.status{font-size:11px;color:var(--mut)}.price{background:#071d24;color:#fff;border-radius:14px;padding:20px;margin:16px 0}.price strong{display:block;font-size:46px;color:#59e0d1}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi div{border:1px solid #dbe7e8;border-radius:9px;padding:10px}.kpi span{display:block;color:#7a9095;font-size:9px}.kpi b{font-size:15px}.decision{font-size:10px;font-weight:900;color:#087c78}table{width:100%;border-collapse:collapse;margin-top:18px;font-size:10px}th,td{padding:9px;border-bottom:1px solid #e4ecee;text-align:left}.note{margin-top:16px;padding:12px;background:#eef7f6;border-left:3px solid var(--c);font-size:10px;color:#536c72}@media(max-width:850px){.grid,.two{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}}</style></head><body>
<section class="hero"><div class="wrap"><small>SGP DECISION PRODUCT / REUSE</small><h1>相場を探す時間を、<br><em>仕入れる判断</em>へ。</h1><p>店舗の過去取引CSVから、類似成約・状態・鮮度・ばらつき・粗利条件を計算し、推奨買取上限とBUY / REVIEW / PASSを返すMVPです。</p></div></section>
<section class="app"><div class="wrap"><div class="grid"><div class="card"><h2>査定条件</h2><button class="sample" id="sample">サンプルCSVを使う</button><label>取引CSV<input id="csv" type="file" accept=".csv,text/csv"></label><p class="status" id="status">未読込</p><div class="two"><label>カテゴリ<input id="category" value="工具"></label><label>ブランド<input id="brand" value="Makita"></label><label>型番<input id="model" value="TD173DRGX"></label><label>状態<select id="condition"><option>S</option><option>A</option><option selected>B</option><option>C</option><option>D</option><option>JUNK</option></select></label></div><label>商品名<input id="name" value="18V インパクトドライバ"></label><hr><div class="two"><label>販売手数料 %<input id="fee" type="number" value="10"></label><label>目標粗利 %<input id="margin" type="number" value="20"></label><label>リスク引当 %<input id="risk" type="number" value="5"></label><label>月次在庫コスト %<input id="hold" type="number" value="1"></label><label>送料 円<input id="shipping" type="number" value="900"></label><label>顧客希望額 円<input id="offer" type="number" value="24000"></label></div><button class="primary" id="run">査定する →</button><p class="status" id="err"></p></div>
<div class="card"><span class="decision" id="decision">DECISION ENGINE</span><h2 id="title">データを読み込んで査定してください</h2><div class="price"><small>推奨買取上限</small><strong id="max">¥0</strong><span id="range">安全レンジ -</span></div><div class="kpi"><div><span>売却予想</span><b id="sale">-</b></div><div><span>中央値</span><b id="median">-</b></div><div><span>比較成約</span><b id="count">-</b></div><div><span>信頼度</span><b id="conf">-</b></div></div><table><thead><tr><th>成約日</th><th>商品</th><th>状態</th><th>売価</th><th>一致度</th></tr></thead><tbody id="body"></tbody></table><div class="note" id="note">AIは最終決裁者ではありません。真贋・故障・付属品・実物状態は担当者が確認します。</div></div></div></div></section><script type="module" src="./app.js"></script></body></html>
