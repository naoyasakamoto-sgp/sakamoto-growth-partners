<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">仙台駅前えらぶ！オリジナル街歩きマップ</title>
  <desc id="desc">仙台駅・青葉通・一番町・東二番丁・クリスロード周辺を、仙台えらぶ！編集部が街歩き向けに整理した概念図</desc>
